<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RailGate - Vadakkekara Crossing</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel (to compile JSX in the browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- ICONS (Since we aren't using npm, we create standard SVG components) ---
    const Icon = ({ children, className }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        {children}
      </svg>
    );
    const Train = ({className}) => <Icon className={className}><path d="M4 15h16v-6a4 4 0 0 0-4-4h-8a4 4 0 0 0-4 4v6z"/><path d="M4 15l-2 4h20l-2-4"/><path d="M8 15v4"/><path d="M16 15v4"/><path d="M9 7h6"/></Icon>;
    const Clock = ({className}) => <Icon className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></Icon>;
    const AlertTriangle = ({className}) => <Icon className={className}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></Icon>;
    const CheckCircle = ({className}) => <Icon className={className}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></Icon>;
    const Info = ({className}) => <Icon className={className}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></Icon>;
    const Calendar = ({className}) => <Icon className={className}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></Icon>;
    const MapPin = ({className}) => <Icon className={className}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></Icon>;
    const Settings = ({className}) => <Icon className={className}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"/></Icon>;
    const ShieldAlert = ({className}) => <Icon className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></Icon>;
    const Activity = ({className}) => <Icon className={className}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></Icon>;
    const RefreshCw = ({className}) => <Icon className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></Icon>;


    // --- TIMETABLE DATA (Changanassery - CGY) ---
    const TRAIN_SCHEDULES = [
      { id: '1', number: '16302', name: 'Venad Express', time: '07:35', direction: 'Shoranur', days: [0,1,2,3,4,5,6], isValid: true },
      { id: '2', number: '16301', name: 'Venad Express', time: '17:25', direction: 'Trivandrum', days: [0,1,2,3,4,5,6], isValid: true },
      { id: '3', number: '16629', name: 'Malabar Express', time: '21:10', direction: 'Trivandrum', days: [0,1,2,3,4,5,6], isValid: true },
      { id: '4', number: '16630', name: 'Malabar Express', time: '03:30', direction: 'Mangalore', days: [0,1,2,3,4,5,6], isValid: true },
      { id: '5', number: '12625', name: 'Kerala Express', time: '14:20', direction: 'New Delhi', days: [0,1,2,3,4,5,6], isValid: true },
      { id: '6', number: '12626', name: 'Kerala Express', time: '07:05', direction: 'Trivandrum', days: [0,1,2,3,4,5,6], isValid: true },
      { id: '7', number: '16382', name: 'Jayanthi Janata', time: '10:40', direction: 'Pune', days: [0,1,2,3,4,5,6], isValid: true },
      { id: '8', number: '16526', name: 'Island Express', time: '19:20', direction: 'Bangalore', days: [0,1,2,3,4,5,6], isValid: true },
      { id: '9', number: '12082', name: 'Jan Shatabdi', time: '10:45', direction: 'Kannur', days: [0,1,3,4,5,6], isValid: true },
      { id: '10', number: '16343', name: 'Amritha Express', time: '23:50', direction: 'Madurai', days: [0,1,2,3,4,5,6], isValid: true },
      { id: '11', number: '16344', name: 'Amritha Express', time: '00:05', direction: 'Trivandrum', days: [0,1,2,3,4,5,6], isValid: true },
      { id: '12', number: '99999', name: 'Unknown Special', time: '??:??', direction: 'Unknown', days: [0], isValid: false }
    ];

    const PREDICTION_WINDOW_MS = 20 * 60 * 1000;

    // --- TIME UTILITIES ---
    const getISTParts = (timestamp) => {
      const formatter = new Intl.DateTimeFormat('en-US', {
        timeZone: 'Asia/Kolkata', year: 'numeric', month: 'numeric', day: 'numeric',
        hour: 'numeric', minute: 'numeric', second: 'numeric', hourCycle: 'h23'
      });
      const parts = formatter.formatToParts(new Date(timestamp));
      const get = (type) => parseInt(parts.find(p => p.type === type)?.value || '0', 10);
      return { year: get('year'), month: get('month') - 1, day: get('day'), hour: get('hour'), minute: get('minute'), second: get('second') };
    };

    const createISTTimestamp = (year, month, day, hour, minute) => {
      const utcTs = Date.UTC(year, month, day, hour, minute);
      return utcTs - (5.5 * 60 * 60 * 1000); 
    };

    const formatTimeInIndia = (timestamp, includeSeconds = false) => {
      return new Intl.DateTimeFormat('en-IN', {
        timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', second: includeSeconds ? '2-digit' : undefined, hour12: true
      }).format(new Date(timestamp));
    };

    const formatDateInIndia = (timestamp) => {
      return new Intl.DateTimeFormat('en-IN', {
        timeZone: 'Asia/Kolkata', weekday: 'long', year: 'numeric', month: 'short', day: 'numeric'
      }).format(new Date(timestamp));
    };

    const formatCountdown = (ms) => {
      if (ms < 0) return '00:00';
      const totalSeconds = Math.floor(ms / 1000);
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;
      if (h > 0) return `${h}h ${m.toString().padStart(2, '0')}m`;
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    };


    // --- PREDICTION LOGIC ---
    const getApplicableTrainEvents = (baseTimeMs, schedule) => {
      const currentIST = getISTParts(baseTimeMs);
      const events = [];
      
      for (let offset = -1; offset <= 2; offset++) {
        const dateObj = new Date(Date.UTC(currentIST.year, currentIST.month, currentIST.day + offset));
        const y = dateObj.getUTCFullYear();
        const m = dateObj.getUTCMonth();
        const d = dateObj.getUTCDate();
        const dayOfWeek = dateObj.getUTCDay();

        schedule.filter(t => t.isValid).forEach(train => {
          if (train.days.includes(dayOfWeek)) {
            const [hh, mm] = train.time.split(':').map(Number);
            const startTs = createISTTimestamp(y, m, d, hh, mm);
            events.push({ train, startTs, endTs: startTs + PREDICTION_WINDOW_MS, formattedStart: formatTimeInIndia(startTs) });
          }
        });
      }
      return events.sort((a, b) => a.startTs - b.startTs);
    };

    const getActiveClosureIntervals = (events) => {
      if (!events.length) return [];
      const merged = [];
      let currentBlock = { start: events[0].startTs, end: events[0].endTs, causes: [events[0]] };

      for (let i = 1; i < events.length; i++) {
        const ev = events[i];
        if (ev.startTs <= currentBlock.end) {
          currentBlock.end = Math.max(currentBlock.end, ev.endTs);
          currentBlock.causes.push(ev);
        } else {
          merged.push(currentBlock);
          currentBlock = { start: ev.startTs, end: ev.endTs, causes: [ev] };
        }
      }
      merged.push(currentBlock);
      return merged;
    };

    const getPredictedGateStatus = (intervals, events, nowMs) => {
      if (!intervals.length) return { status: 'UNAVAILABLE', currentInterval: null, nextInterval: null, upcomingEvents: [] };
      const active = intervals.find(i => i.start <= nowMs && i.end > nowMs);
      const futureIntervals = intervals.filter(i => i.start > nowMs);
      const next = futureIntervals.length > 0 ? futureIntervals[0] : null;
      const upcomingEvents = events.filter(e => e.startTs > nowMs || (e.startTs <= nowMs && e.endTs > nowMs)).slice(0, 7);
      
      if (active) return { status: 'CLOSED', currentInterval: active, nextInterval: next, upcomingEvents };
      return { status: 'OPEN', currentInterval: null, nextInterval: next, upcomingEvents };
    };

    const runAutomatedTests = () => {
      const results = [];
      const testSchedule = [...TRAIN_SCHEDULES];
      const assert = (name, condition, msg) => results.push({ name, passed: condition, message: msg });

      try {
        const t1 = createISTTimestamp(2026, 9, 14, 7, 0); 
        const ev1 = getApplicableTrainEvents(t1, testSchedule);
        const int1 = getActiveClosureIntervals(ev1);
        const p1 = getPredictedGateStatus(int1, ev1, t1);
        assert("1. Time before next train", p1.status === 'OPEN' && p1.nextInterval?.causes[0].train.time === '07:05', `Expected OPEN`);

        const t2 = createISTTimestamp(2026, 9, 14, 7, 5); 
        assert("2. Exact closure start", getPredictedGateStatus(int1, ev1, t2).status === 'CLOSED', `Expected CLOSED`);

        const tOver = createISTTimestamp(2026, 9, 14, 10, 50); 
        const pOver = getPredictedGateStatus(int1, ev1, tOver);
        assert("6. Overlapping schedules", pOver.status === 'CLOSED' && pOver.currentInterval?.causes.length === 2, `Expected 2 causes`);

        const hasInvalid = ev1.some(e => e.train.id === '12');
        assert("10. Exclude invalid schedules", !hasInvalid, "Invalid schedule found");
      } catch (err) {
        assert("Test execution", false, `Fatal error: ${err.message}`);
      }
      return results;
    };


    // --- REACT APP ---
    const App = () => {
      const [actualNow, setActualNow] = useState(Date.now());
      const [testTimeOffset, setTestTimeOffset] = useState(0);
      const [isTestMode, setIsTestMode] = useState(false);
      const [showTests, setShowTests] = useState(false);

      useEffect(() => {
        const timer = setInterval(() => setActualNow(Date.now()), 1000);
        return () => clearInterval(timer);
      }, []);

      const currentEngineTime = isTestMode ? actualNow + testTimeOffset : actualNow;
      const currentISTDateStr = new Date(actualNow).toLocaleDateString('en-US', {timeZone: 'Asia/Kolkata'});
      
      const allEvents = useMemo(() => getApplicableTrainEvents(currentEngineTime, TRAIN_SCHEDULES), [currentISTDateStr]);
      const mergedIntervals = useMemo(() => getActiveClosureIntervals(allEvents), [allEvents]);
      const prediction = getPredictedGateStatus(mergedIntervals, allEvents, currentEngineTime);

      const handleSetTestTime = (e) => {
        const date = new Date(e.target.value);
        if (!isNaN(date.getTime())) {
          setTestTimeOffset(date.getTime() - Date.now());
          setIsTestMode(true);
        }
      };

      const handleResetTime = () => {
        setIsTestMode(false);
        setTestTimeOffset(0);
      };

      return (
        <div className="min-h-screen bg-slate-100 text-slate-900 font-sans pb-12 selection:bg-emerald-200">
          <header className="bg-slate-900 text-white shadow-md rounded-b-3xl mb-6 pb-6 pt-10 px-4">
            <div className="max-w-2xl mx-auto">
              <div className="flex items-center justify-between mb-4">
                <div className="flex items-center gap-3">
                  <div className="bg-indigo-500 p-2 rounded-xl shadow-inner">
                    <Train className="w-6 h-6 text-white" />
                  </div>
                  <div>
                    <h1 className="text-xl font-bold tracking-tight">RailGate Demo</h1>
                    <p className="text-xs text-slate-300 font-medium">Vadakkekara Crossing • Gate 41</p>
                  </div>
                </div>
                <div className="text-right flex flex-col items-end">
                  <div className="text-sm font-semibold text-indigo-200 mb-0.5 tracking-wide">
                    {formatDateInIndia(currentEngineTime)}
                  </div>
                  <div className="text-2xl font-bold tabular-nums tracking-tight leading-none">
                    {formatTimeInIndia(currentEngineTime, true)}
                  </div>
                  <p className="text-[10px] text-indigo-400 font-medium tracking-wide mt-1">IST (ASIA/KOLKATA)</p>
                </div>
              </div>
              
              {isTestMode && (
                <div className="mt-4 bg-indigo-950 border border-indigo-700/50 rounded-lg p-2 text-center text-xs font-semibold text-indigo-300 animate-pulse flex items-center justify-center gap-2">
                  <Activity className="w-4 h-4" /> TEST MODE ACTIVE: TIME IS SIMULATED
                </div>
              )}
            </div>
          </header>

          <main className="max-w-2xl mx-auto px-4 space-y-6">
            <section className={`rounded-3xl p-6 text-white shadow-xl transition-all duration-500 ${
              prediction.status === 'CLOSED' ? 'bg-gradient-to-br from-rose-600 to-red-700 shadow-rose-900/20' : 
              prediction.status === 'OPEN' ? 'bg-gradient-to-br from-emerald-500 to-teal-600 shadow-emerald-900/20' : 
              'bg-slate-700'
            }`}>
              <div className="flex justify-between items-start mb-6">
                <div>
                  <div className="flex items-center gap-2 mb-1 opacity-90 text-sm font-medium tracking-widest uppercase">
                    {prediction.status === 'CLOSED' ? <AlertTriangle className="w-5 h-5" /> : <CheckCircle className="w-5 h-5" />}
                    Estimated Status
                  </div>
                  <h2 className="text-3xl font-black tracking-tight drop-shadow-sm">
                    {prediction.status === 'CLOSED' ? 'PROBABLY CLOSED' : 'PROBABLY OPEN'}
                  </h2>
                </div>
                
                {prediction.status === 'CLOSED' && (
                  <div className="bg-black/20 rounded-xl px-4 py-3 text-right backdrop-blur-sm border border-white/10">
                    <div className="text-xs uppercase font-semibold tracking-wider opacity-80 mb-1">Reopens in</div>
                    <div className="text-3xl font-bold tabular-nums tracking-tighter">
                       {prediction.currentInterval ? formatCountdown(prediction.currentInterval.end - currentEngineTime) : '--:--'}
                    </div>
                  </div>
                )}
              </div>

              {prediction.status === 'CLOSED' && prediction.currentInterval && (
                <div className="bg-black/15 rounded-2xl p-4 backdrop-blur-sm border border-white/10">
                  <p className="text-sm font-medium mb-3 opacity-90 flex items-center gap-2">
                    <Clock className="w-4 h-4" /> Active closure window: {formatTimeInIndia(prediction.currentInterval.start)} to {formatTimeInIndia(prediction.currentInterval.end)}
                  </p>
                  <div className="space-y-2">
                    {prediction.currentInterval.causes.map((cause, idx) => (
                      <div key={idx} className="flex justify-between items-center bg-black/20 rounded-lg p-3">
                        <div>
                          <span className="font-bold block">{cause.train.number} {cause.train.name}</span>
                          <span className="text-xs opacity-80 flex items-center gap-1 mt-1">
                            <MapPin className="w-3 h-3" /> Towards {cause.train.direction}
                          </span>
                        </div>
                        <div className="text-right">
                          <span className="text-sm font-semibold bg-white/20 px-2 py-1 rounded">Sched: {cause.formattedStart}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {prediction.status === 'OPEN' && prediction.nextInterval && (
                <div className="mt-8 flex items-center gap-4 bg-black/15 p-4 rounded-2xl backdrop-blur-sm border border-white/10">
                  <div className="bg-white/20 p-3 rounded-full">
                    <Clock className="w-6 h-6" />
                  </div>
                  <div>
                    <div className="text-sm font-semibold opacity-90">Next closure expected in</div>
                    <div className="text-xl font-bold tabular-nums">
                      {formatCountdown(prediction.nextInterval.start - currentEngineTime)}
                    </div>
                  </div>
                </div>
              )}
            </section>

            {prediction.status === 'OPEN' && prediction.nextInterval && (
              <section className="bg-white rounded-3xl p-5 shadow-sm border border-slate-200">
                <h3 className="text-sm font-bold text-slate-500 uppercase tracking-widest mb-4 flex items-center gap-2">
                  <Train className="w-4 h-4" /> Upcoming Train
                </h3>
                <div className="space-y-3">
                  {prediction.nextInterval.causes.map((cause, idx) => (
                    <div key={idx} className="flex justify-between items-center border-b border-slate-100 pb-3 last:border-0 last:pb-0">
                      <div>
                        <p className="font-bold text-lg text-slate-800">{cause.train.number} {cause.train.name}</p>
                        <p className="text-sm text-slate-500 flex items-center gap-1">
                          <MapPin className="w-3 h-3" /> {cause.train.direction} bound
                        </p>
                      </div>
                      <div className="text-right">
                        <p className="text-slate-800 font-semibold">{cause.formattedStart}</p>
                        <p className="text-xs text-rose-500 font-medium">Closes gate</p>
                      </div>
                    </div>
                  ))}
                </div>
              </section>
            )}

            <section className="bg-blue-50 rounded-2xl p-4 border border-blue-100 flex gap-4">
              <Info className="w-6 h-6 text-blue-500 shrink-0 mt-0.5" />
              <p className="text-sm text-blue-900 leading-relaxed">
                <strong>How this works:</strong> The demo assumes the gate closes exactly at a train's scheduled Changanassery station time and reopens <strong>20 minutes later</strong>. Overlapping trains extend the closure window.
              </p>
            </section>

            <section className="bg-white rounded-3xl p-6 shadow-sm border border-slate-200">
              <h3 className="text-sm font-bold text-slate-500 uppercase tracking-widest mb-5 flex items-center gap-2">
                <Calendar className="w-4 h-4" /> Schedule (Next 5 Events)
              </h3>
              <div className="relative border-l-2 border-slate-200 ml-3 space-y-6">
                {prediction.upcomingEvents.slice(0, 5).map((ev, idx) => {
                  const isActive = ev.startTs <= currentEngineTime && ev.endTs > currentEngineTime;
                  const isNext = !isActive && idx === 0;
                  
                  return (
                    <div key={idx} className="relative pl-6">
                      <div className={`absolute -left-[9px] top-1 w-4 h-4 rounded-full border-4 border-white ${
                        isActive ? 'bg-rose-500' : isNext ? 'bg-amber-500' : 'bg-slate-300'
                      }`} />
                      
                      <div className="flex justify-between items-start">
                        <div>
                          <p className={`font-bold ${isActive ? 'text-rose-600' : 'text-slate-800'}`}>
                            {ev.train.time} - {ev.train.name}
                          </p>
                          <p className="text-xs text-slate-500 mt-1">
                            Train {ev.train.number} • Dir: {ev.train.direction}
                          </p>
                        </div>
                        <div className="text-right">
                          {isActive && (
                            <span className="inline-block bg-rose-100 text-rose-700 text-[10px] font-bold px-2 py-1 rounded-full uppercase tracking-wider">
                              In Progress
                            </span>
                          )}
                          {!isActive && (
                            <span className="text-sm font-medium text-slate-600">
                              in {formatCountdown(ev.startTs - currentEngineTime)}
                            </span>
                          )}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </section>

            <section className="bg-slate-800 rounded-3xl p-5 text-slate-300">
              <div className="flex justify-between items-center mb-4">
                <h3 className="text-sm font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2">
                  <Settings className="w-4 h-4" /> Demo Controls
                </h3>
                <button 
                  onClick={() => setShowTests(!showTests)}
                  className="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1"
                >
                  <Activity className="w-3 h-3" /> {showTests ? 'Hide Tests' : 'Run Tests'}
                </button>
              </div>

              <div className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold mb-2 text-slate-400">Simulate Time & Date</label>
                  <input 
                    type="datetime-local" 
                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                    onChange={handleSetTestTime}
                  />
                </div>
                
                {isTestMode && (
                  <button 
                    onClick={handleResetTime}
                    className="w-full bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl px-4 py-2 text-sm font-bold transition-colors flex justify-center items-center gap-2"
                  >
                    <RefreshCw className="w-4 h-4" /> Return to Actual Time
                  </button>
                )}
              </div>

              {showTests && (
                <div className="mt-6 pt-4 border-t border-slate-700">
                  <h4 className="text-xs font-bold text-slate-400 mb-3 uppercase tracking-wider">Automated Logic Tests</h4>
                  <div className="space-y-2 bg-slate-900 p-3 rounded-xl border border-slate-700 max-h-48 overflow-y-auto text-xs">
                    {runAutomatedTests().map((test, idx) => (
                      <div key={idx} className="flex items-start gap-2">
                        {test.passed ? <CheckCircle className="w-3.5 h-3.5 text-emerald-500 shrink-0 mt-0.5" /> : <AlertTriangle className="w-3.5 h-3.5 text-rose-500 shrink-0 mt-0.5" />}
                        <div>
                          <span className={`font-semibold ${test.passed ? 'text-slate-300' : 'text-rose-400'}`}>{test.name}</span>
                          {!test.passed && <p className="text-rose-400/80 mt-0.5">{test.message}</p>}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </section>

            <footer className="mt-8 mb-4">
              <div className="bg-amber-50 rounded-2xl p-4 border border-amber-200">
                <h4 className="text-amber-900 font-bold text-sm flex items-center gap-2 mb-2">
                  <ShieldAlert className="w-4 h-4" /> Safety Warning
                </h4>
                <p className="text-xs text-amber-800/90 leading-relaxed text-justify">
                  RailGate is an experimental, timetable-based prediction demo. It is <strong>NOT</strong> connected to railway signalling systems, GPS tracking, or real-world sensors. 
                  Actual gate closures depend on live train speeds, delays, unscheduled freight trains, and manual railway operations. 
                  <strong> Always obey railway barriers, physical signals, and railway staff. Never attempt to cross a closed gate.</strong>
                </p>
              </div>
              <p className="text-center text-xs text-slate-400 mt-6 font-medium">
                Demo built based on scheduled timings. Does not reflect live data.
              </p>
            </footer>
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
